<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gaming Hub</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1115;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Card Container */
        .container {
            background: #1a1d24;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #2a2f3a;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Buttons Grid */
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Common Button Style */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
            color: #ffffff;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Roblox Brand Color */
        .btn-roblox {
            background-color: #000000;
            border: 1px solid #ffffff;
        }
        .btn-roblox:hover {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        /* PS+ Brand Color */
        .btn-psplus {
            background-color: #003087;
        }
        .btn-psplus:hover {
            box-shadow: 0 0 15px rgba(0, 48, 135, 0.4);
        }

        /* Discord Brand Color */
        .btn-discord {
            background-color: #5865F2;
        }
        .btn-discord:hover {
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to the Hub</h1>
        <p>Connect with me on my platforms</p>
        
        <div class="links-grid">
            <a href="#" target="_blank" class="btn btn-roblox">Roblox</a>
            <a href="#" target="_blank" class="btn btn-psplus">PS+</a>
            <a href="https://discord.gg" target="_blank" class="btn btn-discord">Join Discord</a>
        </div>
    </div>

</body>
</html>
